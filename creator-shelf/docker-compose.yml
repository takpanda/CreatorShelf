services:
  backend:
    build:
      context: ./backend
    container_name: creator-shelf-backend
    ports:
      - "8080:8080"
    volumes:
      - ${VIDEO_ROOT_HOST}:/media/mp4:ro
      # 追加の動画フォルダ（VIDEO_ROOTS にパスを追加し、ここにもマウントを追加）
      # - ${VIDEO_ROOT_HOST_2}:/media/mp4_2:ro
      - ${PHOTO_ROOT_HOST}:/media/photo:ro
      # 追加の写真フォルダ（PHOTO_ROOTS にパスを追加し、ここにもマウントを追加）
      # - ${PHOTO_ROOT_HOST_2}:/media/photo_2:ro
      - ./data:/app/data
      - ./cache:/app/cache
    environment:
      # カンマ区切りで複数パス指定可: VIDEO_ROOTS=/media/mp4,/media/mp4_2
      VIDEO_ROOTS: ${VIDEO_ROOTS:-/media/mp4}
      # カンマ区切りで複数パス指定可: PHOTO_ROOTS=/media/photo,/media/photo_2
      PHOTO_ROOTS: ${PHOTO_ROOTS:-/media/photo}
      DATABASE_PATH: /app/data/app.db
      THUMBNAIL_DIR: /app/cache/thumbnails
      SCAN_INTERVAL_MINUTES: 60
      TZ: Asia/Tokyo
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/api/health\").read()'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8080
    container_name: creator-shelf-frontend
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://backend:8080
      TZ: Asia/Tokyo
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
